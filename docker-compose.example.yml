# Copier en docker-compose.yml et adapter.
services:
  vodio:
    build: .
    image: vodio:local
    container_name: vodio
    restart: unless-stopped
    # Facultatif — seulement si vous préférez la config par fichier plutôt
    # que par la page web /setup (cf. README) : décommentez après avoir créé
    # vodio.env (cp .env.example vodio.env && chmod 600 vodio.env).
    # env_file: vodio.env
    ports:
      - "8000:8000"          # accès direct http://IP:8000 (manifest, page web)
    volumes:
      - vodio-data:/app/data # catalogue + watchlist persistés
    # ── Exemple reverse-proxy Traefik (PathPrefix /vodio, stripprefix) ──
    # networks: [votre_reseau]
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.vodio.rule=Host(`votre.domaine.tld`) && PathPrefix(`/vodio`)"
    #   - "traefik.http.routers.vodio.entrypoints=websecure"
    #   - "traefik.http.routers.vodio.tls.certresolver=votre-resolver"
    #   - "traefik.http.routers.vodio.middlewares=vodio-strip"
    #   - "traefik.http.middlewares.vodio-strip.stripprefix.prefixes=/vodio"
    #   - "traefik.http.services.vodio.loadbalancer.server.port=8000"

volumes:
  vodio-data:
